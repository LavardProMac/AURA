<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up — AURA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-color: #fdfbf7;
        }
        .auth-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .auth-tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e5e5e5;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding-bottom: 12px;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            color: #777;
            transition: all 0.3s ease;
            position: relative;
        }
        .auth-tab.active { color: #111; }
        .auth-tab.active::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: #111;
        }
        .auth-form { display: none; animation: fadeIn 0.4s ease; }
        .auth-form.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block; font-size: 0.85rem; margin-bottom: 8px; color: #555; text-transform: uppercase; letter-spacing: 1px;
        }
        .form-group input {
            width: 100%; padding: 14px 16px; border: 1px solid #e5e5e5; font-family: inherit; font-size: 1rem; outline: none; transition: border-color 0.3s ease; box-sizing: border-box;
        }
        .form-group input:focus { border-color: #111; }
        .forgot-password {
            display: block; text-align: right; font-size: 0.85rem; color: #777; margin-top: -10px; margin-bottom: 20px; text-decoration: none;
        }
        .forgot-password:hover { color: #111; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header class="navbar" style="padding: 20px; text-align: center; background: #fff; border-bottom: 1px solid #e5e5e5;">
        <a href="index.html" class="brand-logo" style="font-size: 24px; font-weight: bold; text-decoration: none; color: #111; font-family: 'Cormorant Garamond', serif;">AURA.</a>
    </header>

    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="switchTab('loginForm')">Sign In</div>
                <div class="auth-tab" onclick="switchTab('registerForm')">Create Account</div>
            </div>

            <!-- Sign In Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
                <button type="submit" style="width: 100%; padding: 15px; background: #111; color: #fff; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <button type="submit" style="width: 100%; padding: 15px; background: #111; color: #fff; border: none; cursor: pointer; font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">Create Account</button>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));

            if (tabId === 'loginForm') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
            }
            document.getElementById(tabId).classList.add('active');
        }

        function handleRegister(event) {
            event.preventDefault();
            const userName = document.getElementById('reg-name').value;
            localStorage.setItem('saved_user_name', userName);
            
            alert('Account created successfully! Please sign in.');
            switchTab('loginForm');
        }

        function handleLogin(event) {
            event.preventDefault();
            if (!localStorage.getItem('saved_user_name')) {
                localStorage.setItem('saved_user_name', 'Valued Customer');
            }
            // Corrected: Redirects back to index.html after sign in
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
